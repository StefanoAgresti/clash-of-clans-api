<div class="flex flex-col items-center w-full">
  <!-- Toggle Buttons -->
  <div class="flex space-x-2 mb-4 p-1 bg-slate-200 rounded-lg">
    <button
      [ngClass]="
        searchType === 'players'
          ? 'bg-white text-blue-600 shadow rounded-md'
          : 'text-slate-600 hover:bg-slate-100 rounded-md'
      "
      (click)="searchType = 'players'"
      class="py-2 px-4 text-sm font-medium transition-all duration-150 ease-in-out"
    >
      Search Players
    </button>
    <button
      [ngClass]="
        searchType === 'clans'
          ? 'bg-white text-blue-600 shadow rounded-md'
          : 'text-slate-600 hover:bg-slate-100 rounded-md'
      "
      (click)="searchType = 'clans'"
      class="py-2 px-4 text-sm font-medium transition-all duration-150 ease-in-out"
    >
      Search Clans
    </button>
  </div>

  <!-- Input and Search Button -->
  <div class="flex items-center w-full max-w-sm">
    <input
      type="text"
      [(ngModel)]="tag"
      [placeholder]="
        searchType === 'players' ? 'Find a player (#TAG)' : 'Find a clan (#TAG)'
      "
      class="flex-grow px-4 py-2 border border-slate-300 rounded-l-md focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition duration-150 ease-in-out text-sm"
    />
    <button
      (click)="onSearch()"
      class="px-4 py-2 bg-blue-600 text-white rounded-r-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-1 transition duration-150 ease-in-out text-sm font-medium"
    >
      Search
    </button>
  </div>
</div>
