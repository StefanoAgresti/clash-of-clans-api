<div class="bg-white rounded-lg shadow-sm overflow-hidden">
  <h3
    class="text-base font-semibold text-slate-700 px-4 py-3 border-b border-slate-200"
  >
    Trofei Base Costruttore
  </h3>
  <ul class="divide-y divide-slate-100">
    @for (player of playerBbRankings; track player.tag) {
    <li class="hover:bg-slate-50 transition-colors duration-150">
      <button
        (click)="redirectToPlayerPage(player.tag)"
        class="w-full text-left flex justify-between items-center px-4 py-2.5"
      >
        <span class="text-sm font-medium text-slate-800 truncate mr-2">{{
          player.name
        }}</span>
        <span class="text-sm text-slate-500 whitespace-nowrap">{{
          player.builderBaseTrophies
        }}</span>
      </button>
    </li>
    } @empty {
    <li class="px-4 py-3 text-sm text-slate-500 italic">
      No builder base rankings available.
    </li>
    }
  </ul>
</div>
